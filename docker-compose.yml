services:
  backend_trade_compliance:
    environment: 
      - DEBUG=0
      - FLASK_PORT=5000
      - DATABASE_URL=sqlite:///compliance_system.db
      - AUTO_INITIALIZE_DB=TRUE
    build:
      context: .
      dockerfile: dockerfile.backend
    image: backend_trade_compliance
    ports:
        - 5000:5000
    volumes:
      # Mount named volume for database persistence
      # Flask creates an instance folder with compliance_system.db inside it
      # This volume persists the instance folder (and database) across container restarts
      # For cloud deployment, this can be backed by S3 using volume plugins (e.g., rexray/s3fs)
      - instance_data:/app/instance
  frontend_trade_compliance:
    build:
      context: .
      dockerfile: dockerfile.frontend
    image: frontend_trade_compliance
    environment:
      - API_BASE_URL=http://backend_trade_compliance:5000
    ports:
      - 80:80
    depends_on:
      - backend_trade_compliance
    # volumes:
    #   - ./data:/flaskapp/data

volumes:
  # Named volume for database persistence
  # This can be backed by S3 or other cloud storage using volume plugins
  instance_data:

